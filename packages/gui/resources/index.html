<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #0f0e0d;
      --bg-panel: #19161a;
      --line: #2c2724;
      --ember: #f2661a;
      --ember-soft: #ffb37a;
      --text: #f5ede4;
      --text-muted: #8f877e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-void);
      color: var(--text);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      padding: 28px 32px;
      min-height: 100vh;
    }

    h1, h2, h3, .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 4px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 13px;
      margin: 0 0 24px 0;
    }

    #profile-bar {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    select, input, textarea, button {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 12px;
    }

    button {
      cursor: pointer;
      font-weight: 500;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    button:hover {
      border-color: var(--ember);
      color: var(--ember-soft);
    }

    button.primary {
      background: var(--ember);
      border-color: var(--ember);
      color: #1a0f08;
      font-weight: 700;
    }

    button.primary:hover {
      background: var(--ember-soft);
      border-color: var(--ember-soft);
      color: #1a0f08;
    }

    /* Repo list with git-graph thread */
    #repo-section {
      position: relative;
      margin-bottom: 24px;
    }

    #repo-list {
      list-style: none;
      padding: 0 0 0 28px;
      margin: 0;
      position: relative;
    }

    #repo-list::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: var(--line);
    }

    #repo-list li {
      position: relative;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #repo-list li::before {
      content: "";
      position: absolute;
      left: -23px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ember);
      box-shadow: 0 0 0 3px var(--bg-void);
    }

    #repo-list .repo-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    #repo-list .repo-actions button {
      margin-left: 6px;
      padding: 5px 10px;
      font-size: 12px;
    }

    /* Sleeping cat empty state */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 48px 0;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    #empty-state svg {
      width: 96px;
      height: 96px;
      margin-bottom: 14px;
      animation: breathe 3.5s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      #empty-state svg { animation: none; }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    #clone-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    #clone-form input { flex: 1; }

    #status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      white-space: pre-wrap;
      min-height: 18px;
      margin-bottom: 24px;
      border-left: 2px solid var(--line);
      padding-left: 10px;
    }

    #status.error {
      color: var(--ember);
      border-left-color: var(--ember);
    }

    /* Changes panel */
    #changes-panel {
      display: none;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }

    #changes-panel h3 {
      margin: 0 0 14px 0;
      font-size: 14px;
      color: var(--ember-soft);
    }

    #branch-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    #empty-state.waking svg {
      animation: wake 0.5s ease-out forwards;
    }
    @keyframes wake {
      0% { transform: scale(1, 1); }
      35% { transform: scale(1.1, 0.9); }
      70% { transform: scale(0.95, 1.05); }
      100% { transform: scale(1, 1); opacity: 0; }
    }
    #repo-list.entering {
      animation: riseIn 0.4s ease-out;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #empty-state.waking svg, #repo-list.entering { animation: none; }
    }

    #branch-select::before { content: "⎇ "; }

    #changes-file-list {
      list-style: none;
      padding: 0;
      margin: 0 0 14px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    #changes-file-list li {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
    }

    #changes-file-list .status-tag {
      color: var(--ember);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #commit-message {
      width: 100%;
      resize: vertical;
      margin-bottom: 10px;
      font-family: 'Inter', sans-serif;
    }

    #changes-panel > div {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Update bar */
    #update-bar {
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #update-status { color: var(--text-muted); }

    /* Modal */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 14, 13, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #modal-box {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 22px;
      width: 320px;
    }

    #modal-box h3 {
      margin: 0 0 14px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    #modal-fields input {
      width: 100%;
      margin-bottom: 10px;
    }

    #modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>🐈 Cat</h1>
  <p class="tagline">Your repos, carried on this drive.</p>

  <div id="profile-bar">
    <label for="profile-select">Profile</label>
    <select id="profile-select"></select>
    <button id="new-profile-btn">+ New profile</button>
  </div>

  <div id="repo-section">
    <ul id="repo-list"></ul>

    <div id="empty-state">
      <svg viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="55" rx="46" ry="20" fill="#2c2724"/>
        <path d="M20 50 Q10 20 35 25 Q45 10 60 22 Q75 10 85 25 Q110 20 100 50 Q100 68 60 68 Q20 68 20 50Z" fill="#f2661a"/>
        <path d="M32 26 Q28 30 34 34" stroke="#0f0e0d" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M88 26 Q92 30 86 34" stroke="#0f0e0d" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <div>Cat's asleep. Clone a repo to wake it up.</div>
    </div>
  </div>

  <div id="clone-form">
    <input id="clone-url" type="text" placeholder="git remote URL" />
    <button id="clone-btn" class="primary">Clone</button>
  </div>

  <div id="status"></div>

  <div id="changes-panel">
    <h3 id="changes-repo-name"></h3>

    <div id="branch-bar">
      <label for="branch-select">Branch</label>
      <select id="branch-select"></select>
      <button id="new-branch-btn">+ New branch</button>
    </div>

    <ul id="changes-file-list"></ul>
    <textarea id="commit-message" placeholder="Describe this commit" rows="2"></textarea>
    <div>
      <button id="commit-btn" class="primary">Commit</button>
      <button id="changes-close-btn">Close</button>
    </div>
  </div>

  <div id="update-bar">
    <button id="check-update-btn">Check for updates</button>
    <span id="update-status"></span>
  </div>

  <div id="modal-overlay">
    <div id="modal-box">
      <h3 id="modal-title"></h3>
      <div id="modal-fields"></div>
      <div id="modal-actions">
        <button id="modal-ok-btn" class="primary">OK</button>
        <button id="modal-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
